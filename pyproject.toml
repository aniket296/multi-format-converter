[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-format-converter"
version = "1.0.0"
description = "Offline universal intermediate-DOM batch document converter for Markdown, Word, PDF, RTF, and HTML on Windows 10/11"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Multi-Format Converter Team" }
]
dependencies = [
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "Markdown>=3.6",
    "beautifulsoup4>=4.12.3",
    "striprtf>=0.0.26",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
